# ── Victim-network mode ───────────────────────────────────────────────────────────────
# Use this file when Sentinel and the victim run on the SAME Docker host and you want to reach
# the victim by container name (e.g. http://api-gateway:8080): Sentinel joins the victim's own
# Docker network. Defaults to aquarium-ms's network name (see the networks: section), so against
# that victim no .env edit is needed - just start it first. Works against any victim with its own
# docker-compose stack: point VICTIM_NETWORK_NAME in .env at a different one when needed.
#
# To scan ANY target by URL instead (a public host, a remote IP, or a port mapped on your own
# machine) - without needing the victim's Docker network to exist at all - use
# docker-compose.standalone.yml instead. This file is only for the join-the-victim's-network case.
#
# Plug-and-play setup:
#   1. Start the victim stack first (from its own repo): docker compose up -d
#   2. Only if targeting a victim other than aquarium-ms: cp .env.example .env, then set
#      VICTIM_NETWORK_NAME to that victim's real Docker network name (docker network ls).
#   3. docker compose up -d --build
#
# The image is a self-contained jar build (see Dockerfile), so after a code change rebuild with
# `docker compose up -d --build` to pick it up.
#
# If SENTINEL_SCAN_AUTO_TARGET_URL is also set in .env, Sentinel waits for the victim to start
# accepting requests and scans it automatically on startup - no manual POST /api/scans needed:
#   GET http://localhost:8088/api/scans/latest
#
# Without it, trigger scans by hand:
#   POST http://localhost:8088/api/scans  {"targetUrl": "http://<victim-entrypoint>:<port>"}
#
# Every scan is also saved as a JSON file under ./reports on your host (bind-mounted below).

services:
  sentinel:
    image: ghcr.io/f3rren/sentinel:${SENTINEL_VERSION:-latest}
    build: .
    container_name: sentinel
    ports:
      - "8088:8080"
    environment:
      SENTINEL_SCAN_MAX_ENDPOINTS: ${SENTINEL_SCAN_MAX_ENDPOINTS:-25}
      SENTINEL_SCAN_AUTO_TARGET_URL: ${SENTINEL_SCAN_AUTO_TARGET_URL:-}
      # CI gate: set to a severity (e.g. HIGH) to make the auto-scan exit non-zero on findings at
      # or above it. Empty keeps the container running. See .env.example / README.
      SENTINEL_SCAN_FAIL_ON: ${SENTINEL_SCAN_FAIL_ON:-}
      SENTINEL_SCAN_SQL_INJECTION_ENABLED: ${SENTINEL_SCAN_SQL_INJECTION_ENABLED:-true}
      SENTINEL_SCAN_MISSING_AUTHENTICATION_ENABLED: ${SENTINEL_SCAN_MISSING_AUTHENTICATION_ENABLED:-true}
      SENTINEL_SCAN_BRUTE_FORCE_ENABLED: ${SENTINEL_SCAN_BRUTE_FORCE_ENABLED:-true}
      SENTINEL_SCAN_SECURITY_MISCONFIGURATION_ENABLED: ${SENTINEL_SCAN_SECURITY_MISCONFIGURATION_ENABLED:-true}
      SENTINEL_SCAN_XSS_ENABLED: ${SENTINEL_SCAN_XSS_ENABLED:-true}
      SENTINEL_SCAN_DATA_EXPOSURE_ENABLED: ${SENTINEL_SCAN_DATA_EXPOSURE_ENABLED:-true}
      SENTINEL_SCAN_VERBOSE_ERROR_DISCLOSURE_ENABLED: ${SENTINEL_SCAN_VERBOSE_ERROR_DISCLOSURE_ENABLED:-true}
      SENTINEL_SCAN_ACTUATOR_EXPOSURE_ENABLED: ${SENTINEL_SCAN_ACTUATOR_EXPOSURE_ENABLED:-true}
      SENTINEL_SCAN_SENSITIVE_FILE_EXPOSURE_ENABLED: ${SENTINEL_SCAN_SENSITIVE_FILE_EXPOSURE_ENABLED:-true}
      SENTINEL_SCAN_IDOR_ENABLED: ${SENTINEL_SCAN_IDOR_ENABLED:-false}
      SENTINEL_SCAN_BFLA_ENABLED: ${SENTINEL_SCAN_BFLA_ENABLED:-false}
      SENTINEL_SCAN_MASS_ASSIGNMENT_ENABLED: ${SENTINEL_SCAN_MASS_ASSIGNMENT_ENABLED:-false}
      SENTINEL_SCAN_JWT_WEAK_SECRET_ENABLED: ${SENTINEL_SCAN_JWT_WEAK_SECRET_ENABLED:-false}
      SENTINEL_SCAN_RATE_LIMIT_ENABLED: ${SENTINEL_SCAN_RATE_LIMIT_ENABLED:-true}
      SENTINEL_SCAN_RATE_LIMIT_BYPASS_ENABLED: ${SENTINEL_SCAN_RATE_LIMIT_BYPASS_ENABLED:-true}
      SENTINEL_SCAN_RATE_LIMIT_BURST_SIZE: ${SENTINEL_SCAN_RATE_LIMIT_BURST_SIZE:-130}
      # GET-only by default: re-running a scan against a local victim never mutates its data.
      # Widen this in .env once you deliberately want to exercise write endpoints too.
      SENTINEL_SCAN_ALLOWED_HTTP_METHODS: ${SENTINEL_SCAN_ALLOWED_HTTP_METHODS:-GET}
      # DEBUG by default, for full visibility while iterating against a local victim.
      SENTINEL_LOG_HTTP_LEVEL: ${SENTINEL_LOG_HTTP_LEVEL:-DEBUG}
    volumes:
      - ./reports:/app/reports
    networks:
      - victim-network
    restart: "no"

networks:
  victim-network:
    external: true
    # Defaults to aquarium-ms's own network name so this works out of the box against it
    # without touching .env - override VICTIM_NETWORK_NAME there when pointing at a different
    # victim (docker network ls shows the real name for whichever stack is currently running).
    name: ${VICTIM_NETWORK_NAME:-aquarium-ms_aquarium-network}
