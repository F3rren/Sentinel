name: Publish Docker image

# Builds the self-contained image (see Dockerfile) and pushes it to the GitHub Container
# Registry (ghcr.io/f3rren/sentinel) on every version tag. Also runnable on demand from the
# Actions tab (workflow_dispatch) - useful to publish an image for a tag that already existed
# before this workflow was added (e.g. v1.0.0).
#
# The full test suite runs first as a gate: `publish` only starts if `test` passes, so a tag on
# red code never reaches the registry. The Dockerfile itself still builds with -DskipTests (it is
# a pure packaging step - a user running `docker compose up --build` shouldn't have to run the
# suite), which is exactly why the gate lives here in the pipeline instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git ref. metadata-action lowercases the image name, so the
      # F3rren/Sentinel repository maps to ghcr.io/f3rren/sentinel automatically.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
