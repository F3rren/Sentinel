spring.application.name=sentinel

# Sentinel scan engine configuration
sentinel.scan.user-agent=Sentinel-Scanner/0.1 (+authorized-security-testing)
sentinel.scan.request-timeout-ms=8000
sentinel.scan.connect-timeout-ms=5000
sentinel.scan.max-endpoints=25

# Every completed scan is also saved as a pretty-printed JSON file here (relative to the
# working directory unless absolute), named <timestamp>-<host>-<scanId>.json. Set to an empty
# value to disable file persistence and rely only on the in-memory store / REST API.
sentinel.scan.reports-directory=reports

# Only endpoints whose HTTP method is in this list are actually attacked (discovery still
# finds all of them, for the report). Handy to restrict a scan to read-only verbs, e.g.
# sentinel.scan.allowed-http-methods=GET to avoid touching anything that mutates state.
sentinel.scan.allowed-http-methods=GET,POST,PUT,PATCH,DELETE

# If set, Sentinel automatically scans this URL on startup once it becomes reachable - no
# manual POST /api/scans needed. Leave empty (default) to only scan on request.
sentinel.scan.auto-target-url=
sentinel.scan.auto-scan-max-attempts=20
sentinel.scan.auto-scan-retry-delay-ms=3000

# Per-module on/off switch, one property per attack module. Every module defaults to
# enabled; set to false to skip it entirely (the module isn't even instantiated).
sentinel.scan.sql-injection.enabled=true
sentinel.scan.missing-authentication.enabled=true
sentinel.scan.brute-force.enabled=true
sentinel.scan.security-misconfiguration.enabled=true
sentinel.scan.xss.enabled=true
sentinel.scan.data-exposure.enabled=true
sentinel.scan.rate-limit.enabled=true

# IDOR is opt-in instead: it's meaningless without two identities to compare (see
# POST /api/scans' "identities" field), so it stays out of every scan unless explicitly
# turned on here.
# sentinel.scan.idor.enabled=true

# BFLA (Broken Function Level Authorization) is opt-in for the same reason as IDOR: it's
# meaningless without at least one real identity to test with. Flags endpoints whose path
# suggests a privileged/administrative function (e.g. contains "admin") but that a regular
# authenticated identity can still reach.
# sentinel.scan.bfla.enabled=true

# Mass Assignment / BOPLA is opt-in for the same reason as BFLA: it needs at least one real
# identity to reach a write endpoint at all. Adds a small, fixed set of privilege/ownership
# field names (role, isAdmin, ownerId, verified) to a POST/PUT/PATCH endpoint's own sample body
# and checks whether the response echoes them back unbound.
# sentinel.scan.mass-assignment.enabled=true

# Number of common/default credential pairs the brute-force module tries per login-shaped
# endpoint before giving up. Kept small on purpose: a single scan should stay fast and shouldn't
# hammer a real login endpoint.
sentinel.scan.brute-force.max-attempts=8

# Number of back-to-back requests the rate-limit module fires at each GET endpoint before
# concluding no throttling kicked in. GET-only and read-only by construction. Needs to exceed
# the target's real rate-limit capacity to be a meaningful test - a burst smaller than that
# capacity will never trip it and the finding, while not wrong, won't be very informative either.
sentinel.scan.rate-limit.burst-size=130

# Every HTTP request/response an attack module makes against the target is logged at this
# level (method, URL, status code, elapsed time). Defaults to INFO (i.e. silent - a scan can
# make thousands of requests) so it stays opt-in; set to DEBUG when a report needs explaining
# without cross-referencing the target's own logs.
logging.level.com.f3rren.sentinel.http=${SENTINEL_LOG_HTTP_LEVEL:INFO}
